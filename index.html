<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08060F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <title>Finance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2026.10.02-12">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main id="screen" class="screen"></main>
  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="reauth" class="reauth" hidden></div>
  <div id="lock" class="lock" hidden></div>
  <div id="offline" class="offline" role="status" hidden>No connection — changes cannot be saved until you are back online.</div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js?v=2026.10.02-12"></script>
  <script src="js/calc.js?v=2026.10.02-12"></script>
  <script src="js/charts.js?v=2026.10.02-12"></script>
  <script src="js/sheets.js?v=2026.10.02-12"></script>
  <script src="js/app.js?v=2026.10.02-12"></script>
  <script src="https://accounts.google.com/gsi/client" async onload="App.onGisLoaded()"></script>
</body>
</html>
